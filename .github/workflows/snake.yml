name: 🐍 Contribution Snake

on:
  schedule:
    - cron: "0 12 * * *"   # runs daily at noon UTC
  workflow_dispatch:

jobs:
  generate-snake:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: AjayRaut
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit snake SVGs to main branch
        run: |
          cp dist/github-contribution-grid-snake.svg ./github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg ./github-contribution-grid-snake-dark.svg
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git diff --cached --quiet \
            && echo "No changes to commit" \
            || git commit -m "chore: update snake animation [skip ci]" && git push
