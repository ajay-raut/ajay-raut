name: 🐍 Contribution Snake

on:
  schedule:
    - cron: "0 12 * * *"   # runs daily at noon UTC
  workflow_dispatch:

jobs:
  generate-snake:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ajay-raut
          github_token: ${{ secrets.STATS_PAT }}
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark

      - name: Commit snake GIFs to main branch
        run: |
          cp dist/github-contribution-grid-snake.gif ./github-contribution-grid-snake.gif
          cp dist/github-contribution-grid-snake-dark.gif ./github-contribution-grid-snake-dark.gif
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.gif github-contribution-grid-snake-dark.gif
          git diff --cached --quiet \
            && echo "No changes to commit" \
            || git commit -m "chore: update snake animation [skip ci]" && git push
