name: Update Streak Stats

on:
  schedule:
    - cron: "0 3 * * *" # Runs daily
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          options: 'user=ajay-raut&theme=dracula'
          path: streak-stats.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git diff-index --quiet HEAD || (git commit -m "docs: update github streak stats widget" && git push)
