name: 📊 GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"    # runs daily at midnight UTC
  workflow_dispatch:         # allows manual trigger from Actions tab
  push:
    branches: [main, master]

jobs:
  generate-stats:
    name: Generate & Commit Stats SVGs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── Stats + Languages (generated from GitHub API, no Vercel) ──
      - name: Generate Stats & Languages SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YEAR: "2025"
        run: |
          chmod +x .github/scripts/generate-stats.sh
          bash .github/scripts/generate-stats.sh

      # ── Streak Card (demolab — not Vercel, works reliably) ────────
      - name: Fetch Streak SVG
        run: |
          curl -sL \
            -H "Accept: image/svg+xml" \
            -H "User-Agent: GitHubActions/metrics-bot" \
            "https://streak-stats.demolab.com?user=AjayRaut&theme=tokyonight&hide_border=false&border_radius=10&background=0d1117&border=f7733340&ring=f77333&fire=f77333&currStreakLabel=f77333&sideLabels=8b949e&dates=8b949e&currStreakNum=ffffff&sideNums=ffffff" \
            -o github-streak.svg
          echo "✅ github-streak.svg — $(wc -c < github-streak.svg) bytes"

      # ── Validate SVGs ────────────────────────────────────────────
      - name: Validate SVG outputs
        run: |
          for f in github-stats.svg github-langs.svg github-streak.svg; do
            if [ -f "$f" ] && grep -q "<svg" "$f"; then
              echo "✅ $f is valid SVG ($(wc -c < "$f") bytes)"
            else
              echo "⚠️ $f missing or invalid"
            fi
          done

      # ── Commit all SVGs back to repo ─────────────────────────────
      - name: Commit generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-langs.svg github-streak.svg
          git diff --cached --quiet \
            && echo "No changes to commit" \
            || git commit -m "chore: update metrics SVGs [skip ci]" && git push
