<svg width="460" height="100" viewBox="0 0 460 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #f77333; }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .lang-pct { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .row { opacity: 0; animation: fadeIn 0.3s ease-in-out forwards; }
    @keyframes grow { from { width: 0; } }
    .bar rect { animation: grow 0.6s ease-in-out forwards; }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="459" height="99" fill="#0d1117" stroke="#f7733340" stroke-opacity="1"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  <g transform="translate(25, 50)" class="bar">
    <rect x="0" y="0" width="410" height="8" rx="4" fill="#333"/>
    <clipPath id="bar-clip"><rect x="0" y="0" width="410" height="8" rx="4"/></clipPath>
    <g clip-path="url(#bar-clip)">
      
    </g>
  </g>
  <g transform="translate(25, 72)">
    
  </g>
</svg>
